name: RAG checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1e862dfacbd1d6d858c55d9b792c756523627244 # v7.1.4
        with:
          version: "0.11.10"
          python-version: "3.11"
      - name: Configure ephemeral database
        shell: bash
        run: |
          owner_password="$(openssl rand -hex 24)"
          app_password="$(openssl rand -hex 24)"
          reader_password="$(openssl rand -hex 24)"
          echo "::add-mask::$owner_password"
          echo "::add-mask::$app_password"
          echo "::add-mask::$reader_password"
          {
            echo "RAG_DB_OWNER_PASSWORD=$owner_password"
            echo "RAG_DB_APP_PASSWORD=$app_password"
            echo "RAG_DB_PORT=55432"
            echo "RAG_TEST_DATABASE_URL=postgresql://rag_app:$app_password@127.0.0.1:55432/enterprise_rag"
            echo "ENTERPRISE_DB_READER_PASSWORD=$reader_password"
            echo "ENTERPRISE_TEST_READER_URL=postgresql://enterprise_reader:$reader_password@127.0.0.1:55432/enterprise_rag"
          } >> "$GITHUB_ENV"
      - name: Test locked runtime
        run: |
          uv lock --check
          uv build --wheel
          docker compose config --quiet
          docker compose up -d --wait
          uv run --locked --extra course --extra agent pytest -m 'not live'
      - name: Stop database
        if: always()
        run: docker compose stop db

  release-containers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Prepare isolated release fixture
        shell: bash
        run: |
          umask 077
          {
            for key in COURSE_DB_OWNER_PASSWORD COURSE_DB_APP_PASSWORD ENTERPRISE_DB_OWNER_PASSWORD ENTERPRISE_DB_APP_PASSWORD ENTERPRISE_DB_READER_PASSWORD COURSE_RAG_TOKEN ENTERPRISE_ANALYST_TOKEN ENTERPRISE_VIEWER_TOKEN; do
              printf '%s=%s\n' "$key" "$(openssl rand -hex 24)"
            done
            sed -n '/^RAG_EMBEDDING_REVISION=/p' .env.release.example
          } > "$RUNNER_TEMP/enterprise-release.env"
      - name: Build and start both application stacks
        run: |
          python3 tools/release/check_config.py --env-file "$RUNNER_TEMP/enterprise-release.env"
          docker compose --env-file "$RUNNER_TEMP/enterprise-release.env" -f compose.release.yaml -p ci-release config --quiet
          docker compose --env-file "$RUNNER_TEMP/enterprise-release.env" -f compose.release.yaml -p ci-release build course-api
          docker compose --env-file "$RUNNER_TEMP/enterprise-release.env" -f compose.release.yaml -p ci-release up -d --wait --wait-timeout 120 --no-build
          curl --fail --silent http://127.0.0.1:8001/readyz
          curl --fail --silent http://127.0.0.1:8002/readyz
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8001/courses)" = 401
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8002/agent/threads)" = 401
      - name: Stop release fixture
        if: always()
        run: docker compose --env-file "$RUNNER_TEMP/enterprise-release.env" -f compose.release.yaml -p ci-release stop
